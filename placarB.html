<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placar de Basquete</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1>🏀 Placar de Basquete</h1>
    <div class="scoreboard">
        <div class="team" id="teamA">
            <h2 id="teamA-name" class="team-name" onclick="editTeamName('A')" role="button" tabindex="0">Time A</h2>
            <input id="teamA-input" class="team-name-input" type="text" onkeydown="handleTeamNameKey(event, 'A')" onblur="saveTeamName('A')" aria-label="Editar nome do Time A" />
            <div class="score" id="scoreA" aria-label="Pontuação do Time A">0</div>
            <div class="fouls" id="foulsA" aria-label="Faltas do Time A">0</div>
            <button class="add" onclick="addPoints('A', 1)" aria-label="Adicionar 1 ponto ao Time A">+1</button>
            <button class="add" onclick="addPoints('A', 2)" aria-label="Adicionar 2 pontos ao Time A">+2</button>
            <button class="add" onclick="addPoints('A', 3)" aria-label="Adicionar 3 pontos ao Time A">+3</button>
            <button class="remove" onclick="addPoints('A', -1)" aria-label="Remover 1 ponto do Time A">-1</button>
            <button class="remove" onclick="addPoints('A', -2)" aria-label="Remover 2 pontos do Time A">-2</button>
            <button class="remove" onclick="addPoints('A', -3)" aria-label="Remover 3 pontos do Time A">-3</button>
            <button class="add" onclick="addFouls('A', 1)" aria-label="Adicionar 1 falta ao Time A">+1 Falta</button>
            <button class="remove" onclick="addFouls('A', -1)" aria-label="Remover 1 falta do Time A">-1 Falta</button>
        </div>

        <div class="timer">
            <h2>⏱️ Cronômetro</h2>
            <div id="timer" aria-label="Tempo decorrido">00:00:00</div>
            <button onclick="startTimer()" aria-label="Iniciar cronômetro">Iniciar</button>
            <button onclick="stopTimer()" aria-label="Parar cronômetro">Parar</button>
            <button onclick="resetTimer()" aria-label="Reiniciar cronômetro">Reiniciar</button>
        </div>

        <div class="team" id="teamB">
            <h2 id="teamB-name" class="team-name" onclick="editTeamName('B')" role="button" tabindex="0">Time B</h2>
            <input id="teamB-input" class="team-name-input" type="text" onkeydown="handleTeamNameKey(event, 'B')" onblur="saveTeamName('B')" aria-label="Editar nome do Time B" />
            <div class="score" id="scoreB" aria-label="Pontuação do Time B">0</div>
            <div class="fouls" id="foulsB" aria-label="Faltas do Time B">0</div>
            <button class="add" onclick="addPoints('B', 1)" aria-label="Adicionar 1 ponto ao Time B">+1</button>
            <button class="add" onclick="addPoints('B', 2)" aria-label="Adicionar 2 pontos ao Time B">+2</button>
            <button class="add" onclick="addPoints('B', 3)" aria-label="Adicionar 3 pontos ao Time B">+3</button>
            <button class="remove" onclick="addPoints('B', -1)" aria-label="Remover 1 ponto do Time B">-1</button>
            <button class="remove" onclick="addPoints('B', -2)" aria-label="Remover 2 pontos do Time B">-2</button>
            <button class="remove" onclick="addPoints('B', -3)" aria-label="Remover 3 pontos do Time B">-3</button>
            <button class="add" onclick="addFouls('B', 1)" aria-label="Adicionar 1 falta ao Time B">+1 Falta</button>
            <button class="remove" onclick="addFouls('B', -1)" aria-label="Remover 1 falta do Time B">-1 Falta</button>
        </div>
    </div>
    <div class="cronometro-regressivo24">
        <h2>⏱️ Cronômetro Regressivo</h2>
        <div id="timer-regressivo" aria-label="Tempo restante">00:24</div>
        <button id="toggle-timer-regressivo" onclick="toggleTimerRegressivo()" aria-label="Alternar cronômetro regressivo">Iniciar</button>
        <button onclick="resetTimerRegressivo()" aria-label="Reiniciar cronômetro regressivo">Reiniciar</button>
    </div>
    <button class="reset" onclick="resetScore()" aria-label="Reiniciar placar">🔄 Reiniciar</button>

    <script src="script.js"></script>

</body>

</html>
