<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Placar de Basquete</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #222;
        color: white;
        text-align: center;
        padding: 20px;
    }
    h1 {
        margin-bottom: 20px;
    }
    .scoreboard {
        display: flex;
        justify-content: center;
        gap: 50px;
        margin-bottom: 20px;
    }
    .team {
        background: #333;
        padding: 20px;
        border-radius: 10px;
        width: 200px;
    }
    .score {
        font-size: 48px;
        margin: 10px 0;
    }
    button {
        margin: 5px;
        padding: 10px 15px;
        font-size: 16px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    button:hover {
        opacity: 0.8;
    }
    .reset {
        background: red;
        color: white;
    }
    .add {
        background: green;
        color: white;
    }
</style>
</head>
<body>

<h1>🏀 Placar de Basquete</h1>
<div class="scoreboard">
    <div class="team" id="teamA">
        <h2>Time A</h2>
        <div class="score" id="scoreA">0</div>
        <button class="add" onclick="addPoints('A', 1)">+1</button>
        <button class="add" onclick="addPoints('A', 2)">+2</button>
        <button class="add" onclick="addPoints('A', 3)">+3</button>
    </div>
    <div class="team" id="teamB">
        <h2>Time B</h2>
        <div class="score" id="scoreB">0</div>
        <button class="add" onclick="addPoints('B', 1)">+1</button>
        <button class="add" onclick="addPoints('B', 2)">+2</button>
        <button class="add" onclick="addPoints('B', 3)">+3</button>
    </div>
</div>

<button class="reset" onclick="resetScore()">🔄 Reiniciar</button>

<script>
    // Placar inicial
    let scoreA = 0;
    let scoreB = 0;

    // Função para adicionar pontos
    function addPoints(team, points) {
        if (team === 'A') {
            scoreA += points;
            document.getElementById('scoreA').textContent = scoreA;
        } else if (team === 'B') {
            scoreB += points;
            document.getElementById('scoreB').textContent = scoreB;
        }
    }

    // Função para reiniciar o placar
    function resetScore() {
        scoreA = 0;
        scoreB = 0;
        document.getElementById('scoreA').textContent = scoreA;
        document.getElementById('scoreB').textContent = scoreB;
    }
</script>

</body>
</html>
