<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Placar de Basquete</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #222;
        color: white;
        text-align: center;
        padding: 20px;
    }
    h1 {
        margin-bottom: 20px;
    }
    .scoreboard {
        display: flex;
        justify-content: center;
        gap: 50px;
        margin-bottom: 20px;
    }
    .team {
        background: #333;
        padding: 20px;
        border-radius: 10px;
        width: 200px;
    }
    .score {
        font-size: 48px;
        margin: 10px 0;
    }
    button {
        margin: 5px;
        padding: 10px 15px;
        font-size: 16px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    button:hover {
        opacity: 0.8;
    }
    .reset {
        background: red;
        color: white;
    }
    .add {
        background: green;
        color: white;
    }
</style>
</head>
<body>

<h1>🏀 Placar de Basquete</h1>
